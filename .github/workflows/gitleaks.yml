# 秘密情報（鍵・トークンなど）の混入を検査する（Issue #128）
# コードは GitHub の外へ送られない。まずは警告のみ（失敗扱いにしない）で運用する。
name: Gitleaks

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  scan:
    name: 秘密情報の検査
    runs-on: ubuntu-latest
    # 警告のみ。誤検出の確認後に、必須とするかを判断する（docs/security-scans.md）
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
