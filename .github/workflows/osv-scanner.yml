# 依存ライブラリの既知の脆弱性を検査する（Issue #128）
# まずは警告のみ（fail-on-vuln: false）で運用する。
name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 3'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: 依存関係の検査
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.6.0
    with:
      scan-args: |-
        --lockfile=visa-case-app/package-lock.json
      fail-on-vuln: false
